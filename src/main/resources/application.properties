# Server Port
server.port=8080

# Application Name
spring.application.name=smart-campus-platform

# Embedded H2 Database Configuration (Zero-setup instant out-of-the-box run)
spring.datasource.url=jdbc:h2:file:./data/smartcampusdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Secret & Expiration (24 hours)
smartcampus.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
smartcampus.jwt.expiration-ms=86400000

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/
